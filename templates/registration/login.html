{% extends "common.html" %}
    {% block title %}Django Market - Login{% endblock title %}
    {% load static %}
    {% load crispy_forms_tags %}


    {% block content %}
        <div class="container my-5">
            <form method="post" class="container rounded col-md-5 border p-3">
                {% csrf_token %}
                <h4 class="text-center my-2">Log In</h4>
                {{form|crispy}}
                <button class="btn btn-dark w-100">Log in</button>
                <hr>
                <div class="d-flex justify-content-between">
                    <a href="{% url "password_reset" %}" class="text-black">Forgot Password?</a>
                    <a href="{% url "signup" %}" class="text-black">Sign up</a>
                </div>
            </form>
        </div>
    {% endblock %}
