{% extends "common.html" %}
    {% block title %}Django Market - Sign up{% endblock title %}
    {% load static %}
    {% load crispy_forms_tags %}


    {% block content %}
        <div class="container my-5">
            <form method="post" class="container rounded col-md-5 border p-3">
                {% csrf_token %}
                <h4 class="text-center my-2">Sign up</h4>
                {{form|crispy}}
                <button class="btn btn-dark w-100">Sign up</button>
                <hr>
                <div class="d-flex justify-content-between">
                    <p  class="text-black">Already have an account?</p>
                    <a href="{% url "login" %}" class="text-black">Log in</a>
                </div>
            </form>
        </div>
    {% endblock %}
